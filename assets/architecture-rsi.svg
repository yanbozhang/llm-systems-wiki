<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="830" viewBox="0 0 1040 830" role="img" aria-labelledby="title description">
<title id="title">RSI · 系统架构</title><desc id="description">候选不能改写验证器；改进器更新另做同起点、同预算对照，不由系统增益直接推出。</desc>
