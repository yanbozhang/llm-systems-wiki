<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="855" viewBox="0 0 1400 855"><rect width="1400" height="855" fill="#f4f7fb"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="46" font-size="28" fill="#20334f" font-weight="700">七模块能力地图</text><text x="28" y="78" font-size="16" fill="#53657d" font-weight="400">28项能力目标 · 45主题 / 135知识点 · 教学示例与真实实验分开记录</text><text x="218" y="123" font-size="19" fill="#20334f" font-weight="700">理解</text><text x="506" y="123" font-size="19" fill="#20334f" font-weight="700">推导</text><text x="794" y="123" font-size="19" fill="#20334f" font-weight="700">实践</text><text x="1082" y="123" font-size="19" fill="#20334f" font-weight="700">评估</text><rect x="24" y="143" width="1348" height="80" rx="10" fill="#ffffff" stroke="#d3deeb"/><text x="42" y="188" font-size="19" fill="#20334f" font-weight="700">模型网络</text><text x="214" y="172" font-size="14" fill="#20334f" font-weight="400">解释token到logits的计算路径</text><text x="502" y="172" font-size="14" fill="#20334f" font-weight="400">推导注意力、位置与参数预算</text><text x="790" y="172" font-size="14" fill="#20334f" font-weight="400">设计小规模结构正确性实验</text><text x="1078" y="172" font-size="14" fill="#20334f" font-weight="400">区分结构、数值与内核性能变化</text><rect x="24" y="234" width="1348" height="80" rx="10" fill="#ecf2f9" stroke="#d3deeb"/><text x="42" y="279" font-size="19" fill="#20334f" font-weight="700">训练</text><text x="214" y="263" font-size="14" fill="#20334f" font-weight="400">区分预训练、SFT、偏好与策略优化</text><text x="502" y="263" font-size="14" fill="#20334f" font-weight="400">计算损失、低秩参数与相对优势</text><text x="790" y="263" font-size="14" fill="#20334f" font-weight="400">设计数据切分、模板与奖励检查</text><text x="1078" y="263" font-size="14" fill="#20334f" font-weight="400">以独立任务和污染分析判断训练效果</text><rect x="24" y="325" width="1348" height="80" rx="10" fill="#ffffff" stroke="#d3deeb"/><text x="42" y="370" font-size="19" fill="#20334f" font-weight="700">推理</text><text x="214" y="354" font-size="14" fill="#20334f" font-weight="400">解释Prefill、Decode与缓存</text><text x="214" y="377" font-size="14" fill="#20334f" font-weight="400">调度</text><text x="502" y="354" font-size="14" fill="#20334f" font-weight="400">计算KV体积、块分配与时延</text><text x="790" y="354" font-size="14" fill="#20334f" font-weight="400">设计固定版本服务对照实验</text><text x="1078" y="354" font-size="14" fill="#20334f" font-weight="400">综合质量、吞吐、长尾与失败率选运行点</text><rect x="24" y="416" width="1348" height="80" rx="10" fill="#ecf2f9" stroke="#d3deeb"/><text x="42" y="461" font-size="19" fill="#20334f" font-weight="700">Harness</text><text x="214" y="445" font-size="14" fill="#20334f" font-weight="400">解释模型、工具、上下文和宿主责任</text><text x="502" y="445" font-size="14" fill="#20334f" font-weight="400">推演状态转移、预算与恢复条件</text><text x="790" y="445" font-size="14" fill="#20334f" font-weight="400">设计有回读能力的任务执行循环</text><text x="1078" y="445" font-size="14" fill="#20334f" font-weight="400">评估恢复、记忆有效性与边界失效</text><rect x="24" y="507" width="1348" height="80" rx="10" fill="#ffffff" stroke="#d3deeb"/><text x="42" y="552" font-size="19" fill="#20334f" font-weight="700">知识库</text><text x="214" y="536" font-size="14" fill="#20334f" font-weight="400">解释来源、索引、声明和Wiki职责</text><text x="502" y="536" font-size="14" fill="#20334f" font-weight="400">计算检索指标并推演更新影响链</text><text x="790" y="536" font-size="14" fill="#20334f" font-weight="400">设计可追溯的小型RAG或Wiki实验</text><text x="1078" y="536" font-size="14" fill="#20334f" font-weight="400">评估引用支持、更新一致性与维护成本</text><rect x="24" y="598" width="1348" height="80" rx="10" fill="#ecf2f9" stroke="#d3deeb"/><text x="42" y="643" font-size="19" fill="#20334f" font-weight="700">业务Agent</text><text x="214" y="627" font-size="14" fill="#20334f" font-weight="400">区分感知、动作和业务终态</text><text x="502" y="627" font-size="14" fill="#20334f" font-weight="400">推演坐标、任务状态与重试结果</text><text x="790" y="627" font-size="14" fill="#20334f" font-weight="400">设计可回查的GUI或代码任务</text><text x="1078" y="627" font-size="14" fill="#20334f" font-weight="400">按执行证据和协议比较系统可靠性</text><rect x="24" y="689" width="1348" height="80" rx="10" fill="#ffffff" stroke="#d3deeb"/><text x="42" y="734" font-size="19" fill="#20334f" font-weight="700">Benchmark</text><text x="214" y="718" font-size="14" fill="#20334f" font-weight="400">识别基准任务、协议与测量范围</text><text x="502" y="718" font-size="14" fill="#20334f" font-weight="400">计算统计、排名和采样指标</text><text x="790" y="718" font-size="14" fill="#20334f" font-weight="400">设计可复现的多类评测协议</text><text x="1078" y="718" font-size="14" fill="#20334f" font-weight="400">校准裁判、检查污染并解释结论边界</text><text x="28" y="823" font-size="16" fill="#53657d" font-weight="400">交付物：自己的解释与反例 → 可复核推导 → 实践产物 → 协议、失败分析与结论边界</text></g></svg>