name: 维护工具缺陷
description: 报告结构检查、教学代码或来源巡检中的可复现错误
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: Git 提交或 Release、Python 版本及操作系统
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 文件、输入、命令与步骤；请删除私人数据和凭证
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
      description: 说明预期依据，并提供实际错误的最小片段
    validations:
      required: true
