name: 知识库检查
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_pages_artifact:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wiki-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 结构与证据绑定
        run: python scripts/wiki_tool.py check --curriculum
      - name: 逐知识点公式代码图与来源绑定
        run: python scripts/learning_check.py
      - name: 来源目录与保存记录
        run: python scripts/source_library.py check
      - name: 知识与能力地图同步
        run: python scripts/render_maps.py --check
      - name: 单进程维护工具与教学示例测试
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 2097152
          python -m unittest discover -s tests -p 'test_*.py'
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      GOMAXPROCS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装锁定的网站依赖
        run: npm ci --no-audit --no-fund
      - name: 类型与功能检查
        run: |
          npm run check
          npm test
      - name: 构建与产物检查
        run: |
          npm run build
          npm run test:built
      - uses: actions/upload-pages-artifact@v3
        if: inputs.upload_pages_artifact
        with:
          path: web/dist
